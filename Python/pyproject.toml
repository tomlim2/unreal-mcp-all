[project]
name = "unreal-http-bridge"
version = "2.0.0"
description = "Unreal HTTP Bridge: A web server for Unreal Engine integration via HTTP API."
requires-python = ">=3.10"
dependencies = [
  "uvicorn",
  "fastapi",
  "pydantic>=2.6.1",
  "requests",
  "anthropic>=0.59.0",
  "google-generativeai>=0.3.0",
  "pillow>=11.3.0",
  "google-genai>=1.38.0",
  "click>=8.0.0",
  "tabulate>=0.9.0",
  "rich>=13.0.0",
]

[project.scripts]
megamelange = "cli.app:cli"
mm = "cli.app:cli"

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["api", "core", "data_storage", "tools", "cli"] 
